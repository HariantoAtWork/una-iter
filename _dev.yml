services:
  # Hot-reload Nuxt: docker compose -f _dev.yml up -d --build
  # Does not start with plain `docker compose up`.
  literoute-dev:
    image: oven/bun:canary-alpine
    container_name: literoute-dev
    working_dir: /app
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./src/literoute:/app
      - literoute-dev-modules:/app/node_modules  # Linux modules inside the container
      - ./data/literoute:/var/lib/literoute
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - TZ=${TZ:-UTC}
      - ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      - NUXT_ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      - NUXT_DATA_ROOT=${NUXT_DATA_ROOT:-/var/lib/literoute}

volumes:
  literoute-dev-modules:
